// VGRE Cluster gRPC service definition.
// Used when -DVGRE_ENABLE_GRPC=ON to expose kernel dispatch, memory
// allocation, and result collection over a gRPC channel.
//
// This allows distributed ML frameworks (Ray Serve, Horovod, DeepSpeed,
// vLLM multi-node) to treat a VGRE worker as a remote GPU device.

syntax = "proto3";

package vgre.cluster;

// ── Kernel launch ─────────────────────────────────────────────────────────────
message KernelLaunchRequest {
    string  kernel_name    = 1;
    uint32  grid_x         = 2;
    uint32  grid_y         = 3;
    uint32  grid_z         = 4;
    uint32  block_x        = 5;
    uint32  block_y        = 6;
    uint32  block_z        = 7;
    uint64  shared_mem     = 8;
    uint64  stream_id      = 9;
    bytes   args_blob      = 10;  // serialized kernel arguments
}

message KernelLaunchResponse {
    uint32  status         = 1;   // 0 = success, non-zero = cudaError_t
    string  error_msg      = 2;
    uint64  elapsed_us     = 3;   // kernel wall-clock time in microseconds
}

// ── Device memory management ──────────────────────────────────────────────────
message MemAllocRequest {
    uint64  size_bytes     = 1;
}

message MemAllocResponse {
    uint32  status         = 1;
    uint64  dev_ptr        = 2;   // opaque device pointer handle
}

message MemFreeRequest {
    uint64  dev_ptr        = 1;
}

message MemFreeResponse {
    uint32  status         = 1;
}

// ── Memory copy ───────────────────────────────────────────────────────────────
enum MemcpyKind {
    HOST_TO_DEVICE = 0;
    DEVICE_TO_HOST = 1;
    DEVICE_TO_DEVICE = 2;
}

message MemcpyRequest {
    uint64      dst_ptr    = 1;
    uint64      src_ptr    = 2;
    uint64      size_bytes = 3;
    MemcpyKind  kind       = 4;
    bytes       host_data  = 5;   // populated for HOST_TO_DEVICE transfers
}

message MemcpyResponse {
    uint32  status         = 1;
    bytes   host_data      = 2;   // populated for DEVICE_TO_HOST transfers
}

// ── Synchronization ───────────────────────────────────────────────────────────
message SyncRequest {
    uint64  stream_id      = 1;   // 0 = device-wide sync
}

message SyncResponse {
    uint32  status         = 1;
}

// ── Device query ──────────────────────────────────────────────────────────────
message DeviceInfoRequest {}

message DeviceInfoResponse {
    string  device_name    = 1;
    uint64  total_mem      = 2;
    uint64  free_mem       = 3;
    uint32  compute_major  = 4;
    uint32  compute_minor  = 5;
    uint32  sm_count       = 6;
    uint32  max_threads_sm = 7;
}

// ── Telemetry ─────────────────────────────────────────────────────────────────
message TelemetryRequest {}

message TelemetryResponse {
    float   gpu_utilization    = 1;  // 0.0 – 1.0
    float   mem_utilization    = 2;
    uint64  mem_used_bytes     = 3;
    float   temperature_c      = 4;
    uint64  kernels_launched   = 5;
}

// ── Service definition ────────────────────────────────────────────────────────
service VGRECluster {
    rpc LaunchKernel(KernelLaunchRequest)   returns (KernelLaunchResponse);
    rpc AllocMemory (MemAllocRequest)       returns (MemAllocResponse);
    rpc FreeMemory  (MemFreeRequest)        returns (MemFreeResponse);
    rpc CopyMemory  (MemcpyRequest)         returns (MemcpyResponse);
    rpc Synchronize (SyncRequest)           returns (SyncResponse);
    rpc GetDeviceInfo(DeviceInfoRequest)    returns (DeviceInfoResponse);
    rpc GetTelemetry (TelemetryRequest)     returns (TelemetryResponse);
}
