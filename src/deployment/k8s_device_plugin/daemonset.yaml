apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vgre-device-plugin
  namespace: kube-system
spec:
  selector:
    matchLabels:
      name: vgre-device-plugin
  template:
    metadata:
      labels:
        name: vgre-device-plugin
    spec:
      hostNetwork: true
      containers:
        - name: vgre-device-plugin
          image: vgre-device-plugin:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--gpus=1"
          securityContext:
            privileged: true
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
