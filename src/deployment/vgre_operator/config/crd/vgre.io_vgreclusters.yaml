apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vgreclusters.vgre.io
spec:
  group: vgre.io
  names:
    kind: VgreCluster
    listKind: VgreClusterList
    plural: vgreclusters
    singular: vgrecluster
    shortNames:
    - vgrecl
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    subresources:
      status: {}
    schema:
      openAPIV3Schema:
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - masterImage
            - workerImage
            properties:
              replicas:
                type: integer
                minimum: 0
              deploymentMode:
                type: string
                enum:
                - Deployment
                - DaemonSet
              masterImage:
                type: string
              workerImage:
                type: string
              masterPort:
                type: integer
                minimum: 1
                maximum: 65535
              discoveryPort:
                type: integer
                minimum: 1
                maximum: 65535
              secretName:
                type: string
              networkPolicy:
                type: boolean
          status:
            type: object
            properties:
              phase:
                type: string
              readyWorkers:
                type: integer
              masterIP:
                type: string
