[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vgre"
version = "0.1.0"
description = "Virtual GPU Runtime Engine — run CUDA, and train/run an in-tree LM, on CPU"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VGRE" }]
keywords = ["cuda", "gpu", "emulation", "llm", "transformer", "cpu"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: POSIX :: Linux",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/etienne0114/virtual-gpu-runtime"

# Pure-Python ctypes package; the native libvgre.so / libvgre_cudart.so are
# bundled under vgre/lib/ as package data (see build_wheel.sh, which copies the
# CMake-built shared libraries there before `python -m build`). The loader
# (_native._find_library) searches vgre/lib/ first, so the installed wheel is
# self-contained.
[tool.setuptools]
packages = ["vgre"]
include-package-data = true

[tool.setuptools.package-data]
vgre = ["lib/*.so", "lib/*.so.*", "lib/*.dylib", "lib/*.dll"]
