name: CI

# Track 1 (Phase 2): build + test on Linux, macOS and Windows so the
# cross-platform #ifdef branches stop being unverified. Linux is the verified
# baseline and is REQUIRED. macOS/Windows run informationally
# (continue-on-error) while their platform issues are worked down; remove the
# continue-on-error once each is green, then the README/PROJECT_STATUS may
# honestly claim that platform as supported.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Linux: the verified baseline (required) ──────────────────────────────
  linux:
    name: linux-x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain + deps
        # Pin LLVM 18: VGRE targets the LLVM-18 C++ API (ORC ThreadSafeContext::
        # getContext, getHostCPUFeatures(StringMap&)), which changed in 19+. The
        # runner's default `llvm-dev` can resolve to 17, which is < the required 18.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 llvm-18-dev libclang-18-dev \
            libomp-18-dev libsqlite3-dev liblapack-dev \
            libkeyutils-dev libssl-dev zlib1g-dev
          clang++ --version
          cmake --version

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        # Bounded parallelism + load awareness: the JIT tests each fork clang and
        # spin a worker pool, so an unbounded -j oversubscribes the runner and
        # times them out (Phase 2, Track 6). --test-load caps concurrent load.
        working-directory: build
        run: ctest --output-on-failure -j 2 --test-load 4 --timeout 300

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-logs
          path: build/Testing/Temporary/

  # ── macOS: bring-up (informational until green) ──────────────────────────
  macos:
    name: macos-arm64
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        # Pin llvm@18: Homebrew's default `llvm` is 22, whose ORC API dropped
        # ThreadSafeContext::getContext() and changed getHostCPUFeatures() — both
        # of which VGRE uses against the LLVM-18 API. llvm@18 keeps the build green
        # until the code is made multi-LLVM-version compatible.
        run: |
          brew install llvm@18 libomp ninja sqlite lapack || true
          echo "LLVM_DIR=$(brew --prefix llvm@18)/lib/cmake/llvm" >> "$GITHUB_ENV"
          echo "$(brew --prefix llvm@18)/bin" >> "$GITHUB_PATH"

      - name: Configure
        # Build with Homebrew llvm@18's clang++, not AppleClang: AppleClang
        # rejects `-fopenmp` (it needs -Xpreprocessor), and using the same
        # toolchain we link LLVM 18 against keeps the ABI consistent.
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER="$(brew --prefix llvm@18)/bin/clang"
          -DCMAKE_CXX_COMPILER="$(brew --prefix llvm@18)/bin/clang++"
          -DLLVM_DIR="$(brew --prefix llvm@18)/lib/cmake/llvm"
          -DCMAKE_PREFIX_PATH="$(brew --prefix llvm@18);$(brew --prefix libomp)"
          -DOpenMP_ROOT="$(brew --prefix libomp)"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j 2 --test-load 4 --timeout 300

  # ── Windows: bring-up (informational until green) ────────────────────────
  windows:
    name: windows-x86_64
    runs-on: windows-2022
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # NOTE: choco's `llvm` package ships clang but NOT the LLVM CMake package
      # (no LLVMConfig.cmake), so the configure step still fails to find LLVM.
      # Windows needs a prebuilt LLVM-18 dev tree with CMake config (official
      # LLVM release artifact or a vcpkg `llvm` port) — tracked as the remaining
      # Windows bring-up item; the job stays continue-on-error until then.
      - name: Install LLVM
        run: choco install llvm ninja sqlite -y

      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure -j 2 --timeout 300
