name: Deploy inference server (fly.io)

# Redeploys the VGRE inference server to fly.io on push to main when it touches
# the server, its Dockerfile, the fly config, or the Python bindings. Safe no-op
# until the FLY_API_TOKEN repo secret is set — so it never breaks CI before the
# token exists. Add the secret: repo Settings → Secrets and variables → Actions
# → new secret FLY_API_TOKEN (a fly.io *deploy* token, not your password).

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "fly.toml"
      - "bindings/python/vgre/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: fly-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy (skips gracefully without a token)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "FLY_API_TOKEN is not set — skipping deploy."
            echo "Add a fly.io deploy token as the FLY_API_TOKEN repo secret to enable auto-deploy."
            exit 0
          fi
          # Create the app on first run (no-op if it exists or the token is
          # deploy-scoped; then you'd create it once via the fly.io dashboard).
          flyctl apps create vgre-server --org personal 2>/dev/null || true
          flyctl deploy --remote-only --config fly.toml
