name: Release

# Track 19 — build and publish a versioned, multi-arch (amd64/arm64) VGRE runtime
# image to GHCR on a SemVer tag (vX.Y.Z) or manual dispatch. Each architecture is
# built on its OWN native runner in parallel (amd64 on ubuntu-24.04, arm64 on the
# native ubuntu-24.04-arm runner — no slow QEMU emulation), pushed by digest, then
# merged into one multi-arch manifest. The image is pinned by digest in the summary;
# `docker run <image> --version` prints the build-info JSON.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. v0.1.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ── Build each architecture on its native runner, push by digest ──────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }   # native arm64 runner (no QEMU)
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Derive version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            VGRE_VERSION=${{ steps.ver.outputs.version }}
            VGRE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"   # filename = the image digest (no slashes)

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # ── Merge the per-arch digests into one multi-arch manifest ───────────────────
  merge:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Derive version
        id: ver
        run: |
          REF="${{ github.event.inputs.tag || github.ref_name }}"
          echo "version=${REF#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Create & push the multi-arch manifest
        id: manifest
        working-directory: /tmp/digests
        run: |
          # Each file is named after one arch's image digest; assemble the manifest list.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)
          VERSION="${{ steps.ver.outputs.version }}"
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Publish digest to summary
        run: |
          echo "### Published \`${IMAGE}\` (multi-arch amd64 + arm64)" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: \`${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- digest: \`${{ steps.manifest.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- pin with: \`docker pull ${IMAGE}@${{ steps.manifest.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
