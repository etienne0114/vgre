name: Release wheels

# Build self-contained, LLVM-free VGRE wheels on each OS runner and publish them
# to a GitHub Release. Each wheel bundles the native libvgre / libvgre_cudart
# (built with VGRE_ENABLE_JIT=OFF so there is no LLVM runtime dependency) under
# vgre/lib/, so `pip install vgre-*.whl` needs only a C++-free Python + numpy and
# then trains/runs the in-tree LM and executes CUDA-C kernels on CPU.
#
# Trigger:
#   • push a SemVer tag  vX.Y.Z          → build all OS wheels + create the Release
#   • workflow_dispatch (make_release=false, default) → build + upload artifacts only
#     (a dry run so the multi-OS build can be validated in CI before tagging)

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Create a GitHub Release from the built wheels"
        type: boolean
        default: false
      publish_pypi:
        description: "Also publish the wheels to PyPI (needs the PyPI project + trusted publisher configured)"
        type: boolean
        default: false

permissions:
  contents: write        # create the Release / upload assets

jobs:
  build:
    name: wheel-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build the Linux wheel on the oldest supported glibc (22.04 = 2.35) so
          # auditwheel can stamp a broadly-compatible manylinux_2_35 tag that
          # installs on current distros (Ubuntu 22.04+, Debian 12, RHEL 9, …).
          - { os: ubuntu-22.04, name: linux-x86_64 }
          - { os: macos-14,     name: macos-universal2 }  # one wheel: arm64 + x86_64
          - { os: windows-2022, name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Python package versions and release tag
        # The version check uses a Python heredoc; Windows runners default to
        # PowerShell, so select Bash explicitly for this cross-platform step.
        shell: bash
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path("bindings/python/pyproject.toml").read_text())
          project_version = project["project"]["version"]
          init_text = Path("bindings/python/vgre/__init__.py").read_text()
          match = re.search(r'^__version__\s*=\s*["\']([^"\']+)["\']', init_text, re.MULTILINE)
          module_version = match.group(1) if match else None
          shell_text = Path("scripts/vgre.sh").read_text()
          shell_match = re.search(r'^VGRE_VERSION="([^"\\]+)"', shell_text, re.MULTILINE)
          powershell_text = Path("scripts/vgre.ps1").read_text()
          powershell_match = re.search(r'^\$VgreVersion\s*=\s*"([^"\\]+)"', powershell_text, re.MULTILINE)
          cli_versions = [shell_match.group(1) if shell_match else None,
                          powershell_match.group(1) if powershell_match else None]
          if not module_version or project_version != module_version or any(v != project_version for v in cli_versions):
              raise SystemExit(
                  f"Release version mismatch: pyproject={project_version}, "
                  f"vgre.__version__={module_version}, source CLI versions={cli_versions}"
              )
          tag = os.environ["RELEASE_TAG"]
          tag_version = tag.removeprefix("v")
          if tag and project_version != tag_version:
              raise SystemExit(
                  f"Release tag {tag} must match Python package version {project_version}"
              )
          print(f"Python package versions agree: {project_version}")
          if tag:
              print(f"Release tag and Python package version match: {tag_version}")
          PY

      # ── Linux: clang-18, LLVM-free (matches the linux-x86_64-llvm-free CI lane) ──
      # Built on ubuntu-22.04 (glibc 2.35). clang-18 isn't in 22.04's repos, so we
      # add the official LLVM apt channel — this keeps the compiler identical to the
      # known-good 24.04 lane while lowering the glibc floor for a portable wheel.
      - name: Build native + wheel (Linux, LLVM-free)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          sudo apt-get update
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 18
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build \
            libsqlite3-dev liblapack-dev libkeyutils-dev libssl-dev zlib1g-dev
          # patchelf from PyPI (>= 0.17) — 22.04's apt patchelf (0.14.3) is too old
          # for auditwheel (needs >= 0.14.5).
          python -m pip install --upgrade build wheel setuptools numpy auditwheel patchelf
          cmake -S . -B build_rel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVGRE_ENABLE_JIT=OFF -DVGRE_ENABLE_OPENMP=OFF -DVGRE_SIMD_BASELINE=off \
            -DVGRE_USE_LAPACK=OFF \
            -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build build_rel --target vgre vgre_cudart --parallel
          bash bindings/python/build_wheel.sh "$PWD/build_rel"
          # PyPI rejects plain linux_x86_64 wheels. auditwheel vendors the native
          # library's shared-object dependencies and stamps a valid manylinux tag,
          # producing a self-contained, broadly-installable wheel.
          auditwheel show bindings/python/dist/*.whl || true
          auditwheel repair bindings/python/dist/*.whl -w bindings/python/dist_manylinux
          rm -f bindings/python/dist/*.whl
          mv bindings/python/dist_manylinux/*.whl bindings/python/dist/
          echo "==> Final Linux wheel:"; ls -1 bindings/python/dist/*.whl

      # ── macOS: Apple clang, LLVM-free — one universal2 wheel (arm64 + x86_64) ──
      # Built on macos-14 (Apple Silicon) targeting both arches, so it installs on
      # Intel and Apple-Silicon Macs from a single wheel. No Homebrew libs (which
      # are single-arch); LAPACK/OpenSSL are disabled and SQLite comes from the
      # universal macOS SDK, so every linked library is universal.
      - name: Build native + wheel (macOS universal2, LLVM-free)
        if: startsWith(matrix.os, 'macos')
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          brew install cmake ninja || true
          python -m pip install --upgrade build wheel setuptools numpy
          cmake -S . -B build_rel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVGRE_ENABLE_JIT=OFF -DVGRE_ENABLE_OPENMP=OFF -DVGRE_SIMD_BASELINE=off \
            -DVGRE_USE_LAPACK=OFF -DVGRE_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_SYSROOT="$(xcrun --show-sdk-path)"
          cmake --build build_rel --target vgre vgre_cudart --parallel
          bash bindings/python/build_wheel.sh "$PWD/build_rel"
          # The binaries are fat (arm64+x86_64); retag the wheel universal2.
          python -m wheel tags --platform-tag macosx_11_0_universal2 --remove bindings/python/dist/*macosx*.whl
          echo "==> Final macOS wheel:"; ls -1 bindings/python/dist/*.whl
          lipo -info build_rel/libvgre.dylib || true

      # ── Windows: clang-cl (choco llvm), LLVM-free; git-bash runs build_wheel.sh ──
      - name: Build native + wheel (Windows, LLVM-free)
        if: matrix.os == 'windows-2022'
        shell: bash
        run: |
          choco install llvm ninja sqlite -y --no-progress   # llvm provides clang-cl
          export PATH="/c/Program Files/LLVM/bin:$PATH"
          python -m pip install --upgrade build wheel setuptools numpy
          cmake -S . -B build_rel -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DVGRE_ENABLE_JIT=OFF -DVGRE_ENABLE_OPENMP=OFF -DVGRE_SIMD_BASELINE=off \
            -DVGRE_WARNINGS_AS_ERRORS=OFF \
            -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          cmake --build build_rel --target vgre vgre_cudart --parallel
          bash bindings/python/build_wheel.sh "$PWD/build_rel"

      - name: Smoke-test the wheel (install fresh, import + LM train)
        shell: bash
        run: |
          SMOKE="$PWD/bindings/python/smoke_test.py"
          python -m pip install numpy "$(ls bindings/python/dist/*.whl)"
          cd "$RUNNER_TEMP" && python "$SMOKE"

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.name }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  release:
    name: publish-release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.make_release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: List assets
        run: ls -R dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
          fail_on_unmatched_files: true
          name: VGRE ${{ github.ref_name }}
          body: |
            **VGRE — Virtual GPU Runtime Engine** — self-contained, LLVM-free CPU wheels.

            `pip install` the wheel for your platform, then:
            ```python
            import vgre
            tok = vgre.Tokenizer().train(open("corpus.txt").read(), num_merges=1024)
            lm  = vgre.LanguageModel(vocab=tok.vocab_size, n_layer=6, d_model=256, n_head=8)
            # train_step / generate — CPU only, no GPU, no LLVM, no external BLAS.
            ```
            Wheels are built with `VGRE_ENABLE_JIT=OFF` (no LLVM runtime dependency);
            the bundled native library runs CUDA-C kernels and the in-tree transformer LM
            on CPU. See the README for the full CUDA-emulation API.

  # ── PyPI (trusted publishing — no API token) ─────────────────────────────────
  # Publishes on a version tag (vX.Y.Z) and on a manual run with publish_pypi=true.
  # PyPI trusted publishing is configured and verified (v0.1.3 was published
  # by this job using OIDC). Matching version tags publish automatically; the
  # workflow_dispatch input can also opt in to publishing. No API token is used.
  pypi:
    name: publish-pypi
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_pypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write        # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # A version's files are immutable on PyPI; skip any already uploaded so
          # a retry after a partial multi-wheel upload doesn't hard-fail.
          skip-existing: true
