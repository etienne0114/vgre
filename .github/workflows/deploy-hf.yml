name: Deploy inference server (Hugging Face Spaces)

# Card-free public hosting: builds the LLVM-free libvgre_nn in CI, then assembles
# a slim runtime-only Space (Python + the prebuilt .so + the stdlib server) and
# pushes it to a Hugging Face Space. HF Spaces are free and need no payment card.
#
# One-time setup:
#   1. Create a free Hugging Face account (no card): https://huggingface.co/join
#   2. Create a write token: https://huggingface.co/settings/tokens (role: write)
#   3. Add it as a repo secret HF_TOKEN (Settings -> Secrets and variables ->
#      Actions). Optionally set HF_SPACE (defaults to <your-username>/vgre-server).
# Then this deploys automatically on push; the Space builds a tiny Python image
# and serves at https://<username>-vgre-server.hf.space

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "bindings/python/vgre/**"
      - "deploy/hf/**"
      - ".github/workflows/deploy-hf.yml"
  workflow_dispatch:

jobs:
  deploy-hf:
    name: huggingface-space
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip if no token
        id: gate
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "${HF_TOKEN}" ]; then
            echo "HF_TOKEN not set — skipping. Add it (a HF write token) to deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install toolchain
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang-18 llvm-18-dev libclang-18-dev \
            libomp-18-dev libssl-dev zlib1g-dev

      - name: Build libvgre_nn (LLVM-free artifact)
        if: steps.gate.outputs.go == 'true'
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build build --target vgre_nn --parallel
          test -f build/src/xla/libvgre_nn.so

      - name: Assemble the Space and push
        if: steps.gate.outputs.go == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ secrets.HF_SPACE }}
        run: |
          python3 -m pip install --quiet "huggingface_hub>=0.24"
          rm -rf space && mkdir -p space/lib
          cp build/src/xla/libvgre_nn.so   space/lib/libvgre_nn.so
          cp -r bindings/python/vgre        space/vgre
          cp server/vgre_server.py          space/vgre_server.py
          cp deploy/hf/Dockerfile           space/Dockerfile
          cp deploy/hf/README.md            space/README.md
          python3 - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          who = api.whoami()["name"]
          repo_id = os.environ.get("HF_SPACE") or f"{who}/vgre-server"
          api.create_repo(repo_id, repo_type="space", space_sdk="docker", exist_ok=True)
          api.upload_folder(folder_path="space", repo_id=repo_id, repo_type="space",
                            commit_message="Deploy VGRE inference server from CI")
          slug = repo_id.replace("/", "-")
          print(f"::notice::Deployed to https://huggingface.co/spaces/{repo_id}  (serves at https://{slug}.hf.space)")
          PY
