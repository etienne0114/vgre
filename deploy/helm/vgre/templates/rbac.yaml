{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "vgre.fullname" . }}-role
  labels:
    {{- include "vgre.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["vgre.io"]
    resources: ["vgreclusters", "vgreclusters/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "vgre.fullname" . }}-binding
  labels:
    {{- include "vgre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "vgre.fullname" . }}-role
subjects:
  - kind: ServiceAccount
    name: {{ include "vgre.serviceAccountName" . }}
    namespace: {{ .Values.namespace }}
{{- end }}
