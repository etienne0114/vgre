{{- if .Values.devicePlugin.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "vgre.fullname" . }}-device-plugin
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "vgre.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vgre.name" . }}-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vgre.name" . }}-device-plugin
    spec:
      serviceAccountName: {{ include "vgre.serviceAccountName" . }}
      hostNetwork: true
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      containers:
        - name: device-plugin
          image: "{{ .Values.devicePlugin.image.repository }}:{{ .Values.devicePlugin.image.tag }}"
          imagePullPolicy: {{ .Values.devicePlugin.image.pullPolicy }}
          args:
            - "--gpus={{ .Values.devicePlugin.gpusPerNode }}"
            - "--resource-name={{ .Values.devicePlugin.resourceName }}"
          securityContext:
            privileged: {{ .Values.devicePlugin.privileged }}
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
{{- end }}
