# Flux v2 Kustomization — alternative GitOps controller.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vgre
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/gitops/kustomize/overlays/prod
  prune: true
  sourceRef:
    kind: GitRepository
    name: vgre
  timeout: 3m
