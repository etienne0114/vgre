apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  vgre.io/environment: production
# Production overlay: scale the operator and pin image tags via a strategic patch.
patches:
  - target:
      kind: Deployment
      name: vgre-operator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
